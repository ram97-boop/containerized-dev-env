services:
  code-server:
    image: docker.io/linuxserver/code-server:4.100.2-ls275
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
    volumes:
      - /var/lib/code-server-config:/config
      - $HOME/projects:/config/workspace:z
    userns: keep-id
    annotations:
      run.oci.keep_original_group: 1
    ports:
      - 8443:8443
    restart: unless-stopped
